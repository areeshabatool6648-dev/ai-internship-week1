name: Capstone CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest sentence-transformers chromadb pypdf python-dotenv openai fastapi pydantic

      - name: Run tests
        env:
          OPENROUTER_API_KEY: dummy-key-for-ci
        run: pytest test_capstone.py -v